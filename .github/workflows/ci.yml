# Lint, type-check and test both halves of the app on every push and PR.
#
# Neither job needs Postgres or network access: the backend suite runs against
# an in-memory SQLite database (see backend/tests/conftest.py) and blocks
# outbound HTTP, so there is no service container here on purpose.
name: CI

on:
  push:
    branches: [main, dev]
  # Every PR, whatever its base, so a feature branch is checked before merge.
  # Pushes are limited to the two long-lived branches so a PR's own commits
  # are not built twice.
  pull_request:

# A new push makes the run in progress irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the floor in the README. Paths for the cache are resolved
          # from the repo root, not the working-directory above.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Default rule set (pyflakes + the pycodestyle errors that signal real
      # bugs). Deliberately not line-length: 39 existing lines exceed 88, and
      # reflowing them would bury this change in unrelated diff.
      - name: Lint
        run: ruff check .

      # No .env exists in CI. Every setting in app/config.py has a default and
      # conftest.py supplies the Fernet key, so this also guards against a
      # future setting that only works on a developer's machine.
      - name: Tests
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b && vite build` — this is the type-check as well as the build.
      - name: Type-check and build
        run: npm run build
